version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fhir-biobank-postgres
    environment:
      POSTGRES_DB: biobank_fhir_db
      POSTGRES_USER: fhir_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - biobank_postgres_data:/var/lib/postgresql/data

  fhir-biobank:
    build: 
      context: ../
      dockerfile: deployment/Dockerfile
    container_name: fhir-biobank-server
    environment:
      - SPRING_PROFILES_ACTIVE=r4,biobank
      - DB_URL=jdbc:postgresql://postgres:5432/biobank_fhir_db
      - DB_USERNAME=fhir_user
      - DB_PASSWORD=${DB_PASSWORD}
      - HOSPITAL_NAME=${HOSPITAL_NAME:-Research Biobank}
      - HOSPITAL_ID=${HOSPITAL_ID:-BB-001}
      - HOSPITAL_TYPE=biobank
      - EHR_ENABLED=false
      - BIOBANK_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  biobank_postgres_data: